<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- TASK 1 & 3: Login Form with Labels, Email Validation, and Required Attributes -->
<h2>Login Form</h2>
<form>
  <div>
    <label for="login-email">Email:</label>
    <input type="email" id="login-email" name="email" required>
  </div>
  
  <div>
    <label for="login-password">Password:</label>
    <input type="password" id="login-password" name="password" required>
  </div>
  
  <button type="submit">Log In</button>
</form>

<hr>

<!-- TASK 2: Showcase of Different Form Input Types -->
<h2>Input Types Showcase</h2>
<form>
  <div>
    <label for="input-text">Text:</label>
    <input type="text" id="input-text" placeholder="Type text here...">
  </div>

  <div>
    <label for="input-email">Email:</label>
    <input type="email" id="input-email" placeholder="user@example.com">
  </div>

  <div>
    <label for="input-pass">Password:</label>
    <input type="password" id="input-pass">
  </div>

  <div>
    <label for="input-num">Number:</label>
    <input type="number" id="input-num" min="1" max="100">
  </div>

  <div>
    <label for="input-check">
      <input type="checkbox" id="input-check"> Subscribe to newsletter
    </label>
  </div>

  <div>
    <p>Select Gender:</p>
    <label><input type="radio" name="gender" value="male"> Male</label>
    <label><input type="radio" name="gender" value="female"> Female</label>
  </div>

  <div>
    <label for="input-select">Select Option:</label>
    <select id="input-select">
      <option value="1">Option 1</option>
      <option value="2">Option 2</option>
    </select>
  </div>

  <div>
    <label for="input-area">Textarea:</label>
    <textarea id="input-area" rows="3" placeholder="Enter long text..."></textarea>
  </div>
</form>

<hr>

<!-- TASK 4: Contact Form with Name, Email, Subject (3 Options), Message, and Submit -->
<h2>Contact Us</h2>
<form class="contact-form">
  <div class="form-group">
    <label for="contact-name">Name:</label>
    <input type="text" id="contact-name" name="name" required>
  </div>

  <div class="form-group">
    <label for="contact-email">Email:</label>
    <input type="email" id="contact-email" name="email" required>
  </div>

  <di class="form-group">
    <label for="contact-subject">Subject:</label>
    <select id="contact-subject" name="subject">
      <option value="general">General Inquiry</option>
      <option value="support">Technical Support</option>
      <option value="feedback">Feedback</option>
    </select>
  </div>

  <div class="form-group">
    <label for="contact-message">Message:</label>
    <textarea id="contact-message" name="message" rows="4" required></textarea>
  </div>

  <button type="submit" class="submit-btn">Send Message</button>
</form>
</body>
</html>
